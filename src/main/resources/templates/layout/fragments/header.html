<div th:fragment="header" xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
  <header class="flex items-center justify-between bg-orange-800 p-4 border-b border-gray-700 shadow-sm">

    <div class="flex items-center space-x-3">
      <!-- Botão para MINIMIZAR / EXPANDIR a barra lateral -->
      <button @click="sidebarAberta = !sidebarAberta" type="button"
        class="hidden md:flex items-center justify-center p-2 rounded-lg text-orange-950 hover:text-white hover:bg-orange-950 focus:outline-none transition"
        title="Alternar Menu Lateral">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd"
            d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5" />
        </svg>
      </button>

      <a th:href="@{/}" class="flex items-center gap-1.5 group">
        <img th:src="@{/images/logo_semfundo.png}" alt="Gerador Clash"
          class="h-10 w-auto object-contain transition-transform group-hover:scale-105" />
        <div class="text-xl font-extrabold tracking-tight text-white md:text-2xl leading-none">
          Gerador <span class="text-emerald-400">Clash</span>
        </div>
      </a>
    </div>

    <!-- Bloco de Autenticação (Login / Informações do Usuário / Logout) -->
    <div class="flex items-center gap-3" th:fragment="usuariologinlogout" id="usuariologinlogout">
      
      <!-- Se o usuário estiver autenticado -->
      <div sec:authorize="isAuthenticated()" class="flex items-center gap-3">
        <div class="hidden sm:flex flex-col text-right">
          <span class="text-sm font-bold text-white leading-tight" sec:authentication="principal.username">usuario</span>
          <span class="text-[11px] font-medium text-orange-200" sec:authorize="hasRole('ADMIN')">Administrador</span>
          <span class="text-[11px] font-medium text-emerald-300" sec:authorize="!hasRole('ADMIN') and hasRole('ORGANIZADOR')">Organizador</span>
        </div>

        <!-- Formulário de Logout via POST (com CSRF) -->
        <form th:action="@{/logout}" method="post" class="inline">
          <button type="submit"
                  class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-orange-950/80 hover:bg-orange-950 text-orange-200 hover:text-white text-xs font-semibold border border-orange-900 transition">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
              <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
            </svg>
            <span>Sair</span>
          </button>
        </form>
      </div>

      <!-- Se o usuário NÃO estiver autenticado -->
      <div sec:authorize="!isAuthenticated()" class="flex items-center gap-2">
        <a th:href="@{/login}"
           class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow transition">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
          </svg>
          <span>Entrar</span>
        </a>
      </div>

    </div>
  </header>
</div>
