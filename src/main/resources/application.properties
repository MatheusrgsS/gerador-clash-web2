spring.application.name=gerador-clash

# Configuracao da conexao com o PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/gerador_clash_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracao do Hibernate / JPA
# Usamos 'validate' para garantir que o Flyway manda no banco
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracao do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration